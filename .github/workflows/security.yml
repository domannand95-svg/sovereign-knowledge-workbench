name: Security and SBOM

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade "setuptools>=83" pip wheel
      - run: python -m pip install -e ".[pdf,plugins]" pip-audit cyclonedx-bom
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file workbench.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-sbom
          path: workbench.cdx.json
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
